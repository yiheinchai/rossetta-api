[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rossetta-example-server"
version = "0.1.0"
description = "Example FastAPI server with Rossetta encryption"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "rossetta-fastapi>=0.1.0",
]
